<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Base Score</title>
<style>
:root{
  --track-height:8px;
  --thumb-size:26px;
  --bg:#f5f7fb;
  --card-bg:#ffffff;
  --text:#0f172a;
  --muted:#475569;
  --value-bg:#f3f5f9;
  --value-border:#e6e9f0;
  --control-bg:#f3f5f9;
  --control-border:#d9dee7;
  --control-hover:#eaf1ff;
  --control-active:#dce8ff;
  --tick:#cbd5e1;
  --thumb-bg:#334155;
  --thumb-border:#ffffff;
  --link:#1d4ed8;
  --shadow:0 4px 20px rgba(0,0,0,0.05);
  color-scheme:light;
  font-family:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial;
}
[data-theme="dark"]{
  --bg:#0b1220;
  --card-bg:#111827;
  --text:#e5e7eb;
  --muted:#94a3b8;
  --value-bg:#1f2937;
  --value-border:#334155;
  --control-bg:#1f2937;
  --control-border:#334155;
  --control-hover:#263447;
  --control-active:#314159;
  --tick:#475569;
  --thumb-bg:#cbd5e1;
  --thumb-border:#0f172a;
  --link:#93c5fd;
  --shadow:0 8px 30px rgba(0,0,0,0.35);
  color-scheme:dark;
}
body{
  margin:0;
  display:flex;
  justify-content:center;
  align-items:flex-start;
  background:var(--bg);
  color:var(--text);
  padding:10px;
}
.card,
.total,
.total-range,
label,
.categories,
.range-text,
.value-box,
.arrow-btn,
.theme-toggle,
.footer a,
body{
  transition:background-color 0.2s ease,color 0.2s ease,border-color 0.2s ease,box-shadow 0.2s ease;
}
.card{
  width:100%;
  max-width:700px;
  background:var(--card-bg);
  border-radius:10px;
  box-shadow:var(--shadow);
  padding:16px;
  text-align:center;
}
.theme-toggle{
  position:fixed;
  top:10px;
  right:10px;
  z-index:1000;
  min-width:110px;
  min-height:40px;
  border-radius:999px;
  border:1px solid var(--control-border);
  background:var(--control-bg);
  color:var(--text);
  font-size:14px;
  font-weight:700;
  cursor:pointer;
}
.theme-toggle:hover{background:var(--control-hover);}
.theme-toggle:active{background:var(--control-active);}
.total{
  font-size:22px;
  font-weight:800;
  margin-bottom:2px;
  color:var(--text);
}
.total-range{
  font-size:13px;
  font-weight:700;
  color:var(--text);
  height:18px;
  opacity:1;
  transition:opacity 0.3s ease;
}
.total-range.fade-out { opacity:0; }
.slider-group{
  display:flex;
  flex-direction:column;
  gap:20px;
  align-items:center;
  margin-top:6px;
}
.slider-row{
  display:grid;
  grid-template-columns:55px 1fr 70px;
  align-items:center;
  width:100%;
  max-width:500px;
  gap:6px;
}
label{
  font-size:15px;
  font-weight:700;
  color:var(--text);
  grid-column:1 / span 3;
  text-align:left;
}
input[type="range"]{
  -webkit-appearance:none;
  appearance:none;
  width:100%;
  height:var(--thumb-size);
  background:transparent;
  margin:6px 0;
}
input[type="range"]::-webkit-slider-runnable-track{
  height:var(--track-height);
  border-radius:999px;
  background:linear-gradient(to right, red, yellow, green);
  transition:background 0.3s ease;
}
input[type="range"]::-moz-range-track{
  height:var(--track-height);
  border-radius:999px;
  background:linear-gradient(to right, red, yellow, green);
  transition:background 0.3s ease;
}
input[type="range"]::-webkit-slider-thumb{
  -webkit-appearance:none;
  width:var(--thumb-size);
  height:var(--thumb-size);
  margin-top:calc((var(--track-height)-var(--thumb-size))/2);
  border-radius:50%;
  background:var(--thumb-bg);
  border:3px solid var(--thumb-border);
  box-shadow:0 2px 6px rgba(0,0,0,0.25);
  transition:transform .08s ease;
}
input[type="range"]:active::-webkit-slider-thumb{transform:scale(0.95);}
input[type="range"]::-moz-range-thumb{
  width:var(--thumb-size);
  height:var(--thumb-size);
  border-radius:50%;
  background:var(--thumb-bg);
  border:3px solid var(--thumb-border);
  box-shadow:0 2px 6px rgba(0,0,0,0.25);
}
.tick-container{
  position:relative;
  width:100%;
  height:8px;
}
.tick{
  position:absolute;
  top:0;
  width:2px;
  height:8px;
  background:var(--tick);
  transform:translateX(-1px);
}
.categories{
  display:flex;
  justify-content:space-between;
  font-size:11px;
  color:var(--text);
  font-weight:600;
  margin-top:3px;
}
.categories span{
  flex:1;
  text-align:center;
}
@media (max-width:460px){
  .categories span::after{content:attr(data-short);}
}
@media (min-width:461px){
  .categories span::after{content:attr(data-full);}
}
.value-stack{
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
}
.value-box{
  font-weight:700;
  font-size:18px;
  background:var(--value-bg);
  border:1px solid var(--value-border);
  border-radius:6px;
  padding:4px 8px;
  min-width:60px;
  text-align:center;
}
.range-text{
  font-size:11px;
  margin-top:2px;
  font-weight:700;
  color:var(--text);
  height:14px;
}
@media (max-width:420px){
  .range-text::after{content:attr(data-short);}
}
@media (min-width:421px){
  .range-text::after{content:attr(data-full);}
}
.arrow-controls{
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  gap:4px;
}
.arrow-btn{
  background:var(--control-bg);
  border:1px solid var(--control-border);
  border-radius:5px;
  font-size:16px;
  width:30px;
  height:30px;
  line-height:28px;
  color:var(--text);
  cursor:pointer;
  user-select:none;
}
.arrow-btn:hover{background:var(--control-hover);}
.arrow-btn:active{background:var(--control-active);}

.footer{
  margin-top:20px;
  font-size:12px;
  text-align:center;
}
.footer a{
  color:var(--link);
  text-decoration:none;
}
@media (max-width:500px){
  .theme-toggle{
    min-width:96px;
    min-height:36px;
    font-size:13px;
  }
}
@media (max-width:900px) and (orientation:portrait){
  body{
    padding-top:78px;
  }
}
@media (prefers-reduced-motion: reduce){
  .card,
  .total,
  .total-range,
  label,
  .categories,
  .range-text,
  .value-box,
  .arrow-btn,
  .theme-toggle,
  .footer a,
  body{
    transition:none;
  }
}

</style>
</head>
<body>
<button id="themeToggle" class="theme-toggle" type="button" aria-label="Switch to dark mode">Dark mode</button>
<div class="card">
  <div class="total">Base Score = <span id="total">10.0</span></div>
  <div class="total-range" id="totalRange"></div>

  <div class="slider-group">

    <div class="slider-row">
      <label for="slider1">Carving</label>
      <div class="arrow-controls">
        <button class="arrow-btn" data-target="slider1" data-dir="up">▲</button>
        <button class="arrow-btn" data-target="slider1" data-dir="down">▼</button>
      </div>
      <div class="slider-stack">
        <input id="slider1" type="range" min="0" max="10" step="0.1" value="5"/>
        <div class="tick-container" data-for="slider1"></div>
        <div class="categories">
          <span data-full="Poor" data-short="P"></span>
          <span data-full="Managing" data-short="M"></span>
          <span data-full="Adequate" data-short="A"></span>
          <span data-full="Good" data-short="G"></span>
          <span data-full="Excellent" data-short="E"></span>
        </div>
      </div>
      <div class="value-stack">
        <div class="value-box" id="val1">5.0</div>
        <div class="range-text" id="range1" data-full="" data-short=""></div>
      </div>
    </div>

    <div class="slider-row">
      <label for="slider2">Abs/Ext</label>
      <div class="arrow-controls">
        <button class="arrow-btn" data-target="slider2" data-dir="up">▲</button>
        <button class="arrow-btn" data-target="slider2" data-dir="down">▼</button>
      </div>
      <div class="slider-stack">
        <input id="slider2" type="range" min="0" max="5" step="0.1" value="2.5"/>
        <div class="tick-container" data-for="slider2"></div>
        <div class="categories">
          <span data-full="Poor" data-short="P"></span>
          <span data-full="Managing" data-short="M"></span>
          <span data-full="Adequate" data-short="A"></span>
          <span data-full="Good" data-short="G"></span>
          <span data-full="Excellent" data-short="E"></span>
        </div>
      </div>
      <div class="value-stack">
        <div class="value-box" id="val2">2.5</div>
        <div class="range-text" id="range2" data-full="" data-short=""></div>
      </div>
    </div>

    <div class="slider-row">
      <label for="slider3">Upper Body</label>
      <div class="arrow-controls">
        <button class="arrow-btn" data-target="slider3" data-dir="up">▲</button>
        <button class="arrow-btn" data-target="slider3" data-dir="down">▼</button>
      </div>
      <div class="slider-stack">
        <input id="slider3" type="range" min="0" max="5" step="0.1" value="2.5"/>
        <div class="tick-container" data-for="slider3"></div>
        <div class="categories">
          <span data-full="Poor" data-short="P"></span>
          <span data-full="Managing" data-short="M"></span>
          <span data-full="Adequate" data-short="A"></span>
          <span data-full="Good" data-short="G"></span>
          <span data-full="Excellent" data-short="E"></span>
        </div>
      </div>
      <div class="value-stack">
        <div class="value-box" id="val3">2.5</div>
        <div class="range-text" id="range3" data-full="" data-short=""></div>
      </div>
    </div>

  </div>

  <div class="footer">
    <a href="https://freedogski.github.io/reversebase/" target="_blank">https://freedogski.github.io/reversebase/</a>
  </div>
  
</div>

<script>
// --- Shared BaseScore Storage ---
function saveBaseScore(value) {
  localStorage.setItem("BaseScore", value);
}

function loadBaseScore() {
  return localStorage.getItem("BaseScore") || 0;
}

const THEME_STORAGE_KEY = "BaseScoreTheme";
function getSystemTheme() {
  return window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
}
function applyTheme(theme) {
  document.documentElement.setAttribute("data-theme", theme);
  localStorage.setItem(THEME_STORAGE_KEY, theme);
  const btn = document.getElementById("themeToggle");
  if (!btn) return;
  const next = theme === "dark" ? "light" : "dark";
  btn.textContent = next === "dark" ? "Dark mode" : "Light mode";
  btn.setAttribute("aria-label", `Switch to ${next} mode`);
}
function initTheme() {
  const saved = localStorage.getItem(THEME_STORAGE_KEY);
  const theme = saved === "dark" || saved === "light" ? saved : getSystemTheme();
  applyTheme(theme);
  const btn = document.getElementById("themeToggle");
  if (btn) {
    btn.addEventListener("click", () => {
      const current = document.documentElement.getAttribute("data-theme") === "dark" ? "dark" : "light";
      applyTheme(current === "dark" ? "light" : "dark");
    });
  }
}
initTheme();
</script>

<script>
(function(){
const sliders=[
  {el:slider1,val:val1,range:range1,max:10},
  {el:slider2,val:val2,range:range2,max:5},
  {el:slider3,val:val3,range:range3,max:5}
];
const totalEl=document.getElementById('total');
const totalRange=document.getElementById('totalRange');
const round1=x=>Math.round(x*10)/10;

function categoryText(v,max){
  let category,low,high;
  if(max===10){
    if(v<=2.0){category="Poor";low=0;high=2.0;}
    else if(v<=4.0){category="Managing";low=2.1;high=4.0;}
    else if(v<=6.0){category="Adequate";low=4.1;high=6.0;}
    else if(v<=8.0){category="Good";low=6.1;high=8.0;}
    else {category="Excellent";low=8.1;high=10.0;}
    const values=[];for(let x=low;x<=high+0.0001;x+=0.1)values.push(round1(x));
    const len=values.length;let cut1,cut2;
    if(category==="Good"||category==="Excellent"){cut1=Math.min(len,6);cut2=Math.min(len,cut1+7);}
    else{cut1=Math.floor(len/3);cut2=Math.floor(len*2/3);}
    const lowEnd=values[cut1-1]??low, midEnd=values[cut2-1]??high;
    return {level:v<=lowEnd?"Low":v<=midEnd?"Mid":"High",category};
  }else{
    if(v<=1.0){category="Poor";low=0;high=1.0;}
    else if(v<=2.0){category="Managing";low=1.1;high=2.0;}
    else if(v<=3.0){category="Adequate";low=2.1;high=3.0;}
    else if(v<=4.0){category="Good";low=3.1;high=4.0;}
    else {category="Excellent";low=4.1;high=5.0;}
    const values=[];for(let x=low;x<=high+0.0001;x+=0.1)values.push(round1(x));
    const len=values.length;let cut1,cut2;
    if(category==="Good"||category==="Excellent"){cut1=3;cut2=6;}
    else{cut1=Math.floor(len/3);cut2=Math.floor(len*2/3);}
    const lowEnd=values[cut1-1]??low, midEnd=values[cut2-1]??high;
    return {level:v<=lowEnd?"Low":v<=midEnd?"Mid":"High",category};
  }
}

function totalCategoryText(total){
  if(total<=0) return "";
  let category,low,high;
  if(total<=4.0){category="Poor";low=0.1;high=4.0;}
  else if(total<=8.0){category="Managing";low=4.1;high=8.0;}
  else if(total<=12.0){category="Adequate";low=8.1;high=12.0;}
  else if(total<=16.0){category="Good";low=12.1;high=16.0;}
  else {category="Excellent";low=16.1;high=20.0;}
  const values=[];for(let x=low;x<=high+0.0001;x+=0.1)values.push(round1(x));
  const cut1=13,cut2=26;
  const lowEnd=values[cut1-1]??low, midEnd=values[cut2-1]??high;
  const level=total<=lowEnd?"Low":total<=midEnd?"Mid":"High";
  return `${level}-${category}`;
}

function sliderColor(v,max){
  const pct=v/max;
  let r,g;
  if(pct<=0.5){
    r=255; g=Math.round(510*pct);
  }else{
    g=255; r=Math.round(510*(1-pct));
  }
  return `rgb(${r},${g},0)`;
}

let lastTotalText="";
function update(){
  let total=0;
  sliders.forEach(({el,val,range,max})=>{
    const v=round1(parseFloat(el.value));
    val.textContent=v.toFixed(1);
    total+=v;
    const {level,category}=categoryText(v,max);
    range.setAttribute("data-full",`${level}-${category}`);
    range.setAttribute("data-short",`${level}-${category[0]}`);
    const color=sliderColor(v,max);
    el.style.setProperty("--slider-color",color);
    el.style.background=`linear-gradient(to right, red, yellow, green)`;
    el.querySelector=undefined;
  });
  const t=round1(total);
  totalEl.textContent=t.toFixed(1);
  const text=totalCategoryText(t);
  if(text!==lastTotalText){
    totalRange.classList.add("fade-out");
    setTimeout(()=>{
      totalRange.textContent=text;
      totalRange.classList.remove("fade-out");
    },150);
    lastTotalText=text;
  }
}
sliders.forEach(({el})=>{
  el.addEventListener('input',update);
  el.addEventListener('change',update);
});

document.querySelectorAll('.arrow-btn').forEach(btn=>{
  let timer,interval;
  const stepAction=()=>{
    const target=document.getElementById(btn.dataset.target);
    const dir=btn.dataset.dir;
    const step=parseFloat(target.step)||0.1;
    let val=parseFloat(target.value)||0;
    val+=dir==="up"?step:-step;
    val=round1(Math.min(parseFloat(target.max),Math.max(parseFloat(target.min),val)));
    target.value=val;update();
  };
  const startHold=()=>{
    stepAction();
    timer=setTimeout(()=>interval=setInterval(stepAction,100),300);
  };
  const stopHold=()=>{
    clearTimeout(timer);clearInterval(interval);
  };
  btn.addEventListener('mousedown',startHold);
  btn.addEventListener('mouseup',stopHold);
  btn.addEventListener('mouseleave',stopHold);
  btn.addEventListener('touchstart',e=>{e.preventDefault();startHold();},{passive:false});
  btn.addEventListener('touchend',stopHold);
  btn.addEventListener('touchcancel',stopHold);
});

document.querySelectorAll('.tick-container').forEach(tc=>{
  for(let i=0;i<=5;i++){
    const tick=document.createElement('div');
    tick.className='tick';
    tick.style.left=(i*20)+'%';
    tc.appendChild(tick);
  }
});
update();
})();
</script>
</body>
</html>
